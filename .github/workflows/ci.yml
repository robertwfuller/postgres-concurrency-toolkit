name: CI Test Suite

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: harness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_PG_DSN: postgresql://test_user:test_password@localhost:5432/harness_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build and verify package distribution
        run: |
          python -m build
      - name: Run Unit and PostgreSQL Integration Suite
        run: |
          pytest -v
